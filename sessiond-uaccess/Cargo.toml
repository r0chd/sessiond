[package]
name = "sessiond-uaccess"
keywords = []
categories = []
edition = "2024"
license = "GPL-3.0-only"
repository = "https://tangled.org/r0chd.pl/sessiond"
version = "0.0.0"
publish = false
description = "Dynamic device access manager"
readme = "README.md"

[dependencies]
anyhow = "1.0.103"
calloop = { version = "0.14.4", features = ["signals"] }
env_logger = { version = "0.11.11", features = ["kv"] }
hyprwire = "0.5.1"
hyprwire-protocols-sessiond = { path = "../hyprwire-protocols-sessiond", version = "0.2.0" }
udev = "0.9.3"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
clap = { version = "4.6.2", features = ["derive"] }
bevy_ecs = { version = "0.19.0", default-features = false }
log = { version = "0.4.33", features = ["kv"] }
posix-acl = "1.2.0"
syslog = "7.0.0"
[workspace]

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
too_many_lines = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
