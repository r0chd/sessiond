when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - linux-pam
    - pkg-config

steps:
  - name: cargo clippy
    command: |
      rustup toolchain install stable
      rustup default stable
      rustup component add clippy

      cargo build -p libsession

      mkdir -p target/pkgconfig
      cat > target/pkgconfig/libsession.pc <<EOF
      prefix=$(pwd)
      libdir=\${prefix}/target/debug
      includedir=\${prefix}/libsession/include

      Name: libsession
      Description: C ABI session management client library
      Version: 0.1.0
      Libs: -L\${libdir} -lsession
      Cflags: -I\${includedir}
      EOF
      export PKG_CONFIG_PATH="$(pwd)/target/pkgconfig"

      cargo clippy --workspace --all-features -- -D warnings
