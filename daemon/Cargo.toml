[package]
name = "daemon"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = { version = "0.11.10", features = ["kv"] }
log = { version = "0.4.31", features = ["kv"] }
calloop = { version = "0.14.4", features = ["signals"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process", "system"] }
zbus = { version = "5.16.0", optional = true }
bevy_ecs = { version = "0.19.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
uzers = "0.12.2"
syslog = "7.0.0"
hyprwire = "0.5.1"

[build-dependencies]
hyprwire-scanner = "0.5.1"

[features]
consolekit = ["dep:zbus"]
