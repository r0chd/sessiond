[package]
name = "daemon"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = { version = "0.11.10", features = ["kv"] }
log = { version = "0.4.31", features = ["kv"] }
hyprwire = "0.4.3"
calloop = { version = "0.14.4", features = ["signals"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process", "system"] }
users = "0.11.0"
zbus = { version = "5.16.0", optional = true }

[build-dependencies]
hyprwire-scanner = "0.4.3"

[features]
consolekit = ["dep:zbus"]
