[package]
name = "libsession"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
version.workspace = true
description.workspace = true
readme.workspace = true

[lib]
name = "session"
crate-type = ["cdylib", "staticlib"]

[dependencies]
hyprwire = { version = "0.5.1", optional = true }
zbus = { version = "5.16.0", optional = true }
hyprwire-protocols-sessiond = { path = "../hyprwire-protocols-sessiond", version = "0.1.0", optional = true }

[build-dependencies]

[features]
default = ["sessiond", "logind", "consolekit"]
sessiond = ["dep:hyprwire", "dep:hyprwire-protocols-sessiond"]
consolekit = ["dep:zbus"]
logind = ["dep:zbus"]

[lints]
workspace = true
