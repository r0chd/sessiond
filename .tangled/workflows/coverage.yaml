when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - cargo
    - cargo-llvm-cov
    - gcc
    - git
    - llvm
    - linux-pam
    - pkg-config
    - jq
    - which

steps:
  - name: coverage
    command: |
      export LLVM_COV=$(which llvm-cov)
      export LLVM_PROFDATA=$(which llvm-profdata)
      cargo build --package daemon --features consolekit
      cargo llvm-cov --package daemon --features consolekit --json --summary-only --output-path coverage.json
      pct=$(jq '.data[0].totals.lines.percent' coverage.json)
      printf '{"schemaVersion":1,"label":"coverage","message":"%.1f%%","color":"brightgreen"}' "$pct" > badge.json

  - name: publish badge
    command: |
      git config user.email "ci@tangled.org"
      git config user.name "CI"
      git add badge.json
      git diff --cached --quiet || git commit -m "chore(ci): update coverage badge"
      git push origin HEAD:master
