engine: nixery

when:
  - event: ["pull_request"]
    branch: ["master"]
  - event: ["push", "manual"]
    branch: ["master"]
  - event: ["manual"]
    branch: ["*"]

environment:
  PKG_CONFIG_PATH: /lib/pkgconfig:/share/pkgconfig
  LIBRARY_PATH: /lib
  RUSTFLAGS: "-L native=/lib"
  RUSTDOCFLAGS: "-L native=/lib"
  LD_LIBRARY_PATH: /lib

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - pkg-config
    - linux-pam.out
    - udev.out
    - udev.dev
    - acl.out
    - acl.dev

steps:
  - name: cargo test
    command: |
      set -eu
      rustup toolchain install stable
      rustup default stable
      pkg-config --libs --cflags pam libudev libsystemd libacl

      cargo test --locked --workspace --exclude libsession --exclude libsession-sys --exclude libsession-rs --no-default-features
      cargo test --locked --workspace --exclude libsession --exclude libsession-sys --exclude libsession-rs --all-features
