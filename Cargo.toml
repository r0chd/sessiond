[workspace]
members = [
  "sessionctl",
  "sessiond",
  "libsession-sys",
  "libsession-rs",
  "pam",
  "hyprwire-protocols-sessiond",
  "sessiond-backlight",
  "sessiond-hooks",
  "sessiond-power/daemon",
  "sessiond-power/client",
  "sessiond-power/actions/*",
  "sessiond-uaccess",
]
resolver = "3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.package]
version = "0.1.0"
keywords = []
categories = []
edition = "2024"
license = "GPL-3.0-only"
repository = "https://tangled.org/r0chd.pl/sessiond"
description = "session management daemon"
readme = "README.md"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
too_many_lines = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
