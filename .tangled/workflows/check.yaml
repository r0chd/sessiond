when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - linux-pam
    - pkg-config
    - udev
    - acl

steps:
  - name: cargo check
    command: |
      rustup toolchain install stable
      rustup default stable

      cargo build -p libsession

      mkdir -p target/pkgconfig
      cat > target/pkgconfig/libsession.pc <<EOF
      prefix=$(pwd)
      libdir=\${prefix}/target/debug
      includedir=\${prefix}/libsession/include

      Name: libsession
      Description: C ABI session management client library
      Version: 0.1.0
      Libs: -L\${libdir} -lsession
      Cflags: -I\${includedir}
      EOF
      export PKG_CONFIG_PATH="$(pwd)/target/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

      cargo check --workspace --all-features
      cargo check --manifest-path sessiond-backlight/Cargo.toml
      cargo check --manifest-path sessiond-hooks/Cargo.toml
      cargo check --manifest-path sessiond-uaccess/Cargo.toml
