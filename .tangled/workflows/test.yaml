when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - cargo
    - cargo-nextest
    - gcc
    - linux-pam
    - pkg-config

steps:
  - name: cargo nextest
    command: |
      cargo nextest run --package daemon
