[package]
name = "libsession-sys"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
version = "0.1.2"
description.workspace = true
readme.workspace = true

[lib]
name = "session"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
zbus = { version = "5.16.0", optional = true }
libsystemd-sys = { version = "0.9.4", optional = true }
libc = "0.2.189"
toml = { version = "1.1.2", optional = true }
serde = { version = "1.0.228", features = ["derive", "rc"], optional = true }
inotify = { version = "0.11.5", default-features = false }
thiserror = "2.0.21"

[features]
default = ["sessiond", "logind", "consolekit"]
sessiond = ["dep:serde", "dep:toml", "monitor"]
monitor = []
consolekit = ["dep:zbus"]
logind = ["dep:libsystemd-sys"]

[lints]
workspace = true
