when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - nixfmt-rfc-style
    - taplo
    - fd
    - rustup

steps:
  - name: nix fmt
    command: |
      fd -t f -e nix -x nixfmt --check '{}'
      fd -t f -e toml -x taplo fmt --check '{}'

  - name: cargo fmt
    command: |
      rustup toolchain install stable
      rustup default stable
      rustup component add rustfmt
      cargo fmt --check
      cargo fmt --manifest-path sessiond-backlight/Cargo.toml --check
      cargo fmt --manifest-path sessiond-hooks/Cargo.toml --check
      cargo fmt --manifest-path sessiond-uaccess/Cargo.toml --check
