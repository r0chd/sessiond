[workspace]
members = ["ctl", "daemon", "pam"]
resolver = "3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.package]
keywords = []
categories = []
edition = "2024"
license = "GPLv3"
repository = "https://tangled.org/r0chd.pl/sessiond"
version = "0.1.0"
description = "session management daemon with VT activity watching"
readme = "README.md"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
too_many_lines = "allow"
similar_names = "allow"
