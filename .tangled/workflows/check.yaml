when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

environment:
  PKG_CONFIG_PATH: /lib/pkgconfig:/share/pkgconfig

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - linux-pam
    - pkg-config
    - libudev-zero
    - acl

steps:
  - name: cargo check
    command: |
      rustup toolchain install stable
      rustup default stable

      cargo build -p libsession

      mkdir -p target/pkgconfig
      sed \
        -e "s|@PREFIX@|$(pwd)|" \
        -e "s|@INCLUDE@|$(pwd)/libsession/include|" \
        -e "s|@LIBDIR@|$(pwd)/target/debug|" \
        -e 's|@LIBSESSION_VERSION@|0.0.0|' \
        libsession/libsession.pc.in > target/pkgconfig/libsession.pc
      export PKG_CONFIG_PATH="$(pwd)/target/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
      pkg-config --libs --cflags libudev

      cargo check --workspace --all-features
      cargo check --manifest-path sessiond-backlight/Cargo.toml
      cargo check --manifest-path sessiond-hooks/Cargo.toml
      cargo check --manifest-path sessiond-uaccess/Cargo.toml
