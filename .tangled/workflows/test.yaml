engine: nixery

when:
  - event: ["pull_request"]
    branch: ["master"]
  - event: ["push", "manual"]
    branch: ["master"]
  - event: ["manual"]
    branch: ["*"]

environment:
  PKG_CONFIG_PATH: /lib/pkgconfig:/share/pkgconfig
  LIBRARY_PATH: /lib
  RUSTFLAGS: "-L native=/lib"
  RUSTDOCFLAGS: "-L native=/lib"
  LD_LIBRARY_PATH: /lib
  NIX_CONFIG: "experimental-features = nix-command flakes"

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - pkg-config
    - nix
    - linux-pam.out
    - udev.out
    - udev.dev
    - acl.out
    - acl.dev

steps:
  - name: cargo test
    command: |
      set -eu
      rustup toolchain install stable
      rustup default stable

      libsession_dev=$(nix build --no-link --print-out-paths -L .#libsession.dev)
      export PKG_CONFIG_PATH="$libsession_dev/lib/pkgconfig:$PKG_CONFIG_PATH"
      export LD_LIBRARY_PATH="$(pkg-config --variable=libdir libsession):$LD_LIBRARY_PATH"

      pkg-config --libs --cflags pam libudev libsystemd libacl 'libsession >= 0.1.3'

      cargo test --locked --workspace --no-default-features
      cargo test --locked --workspace --all-features
