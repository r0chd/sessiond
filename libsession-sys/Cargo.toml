[package]
name = "libsession-sys"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
version = "0.1.0"
description.workspace = true
readme.workspace = true

[lib]
name = "session"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
hyprwire = { version = "0.5.1", optional = true }
zbus = { version = "5.16.0", optional = true }
libsystemd-sys = { version = "0.9.4", optional = true }
hyprwire-protocols-sessiond = { path = "../hyprwire-protocols-sessiond", version = "0.2.0", optional = true }
libc = "0.2.189"

[build-dependencies]

[features]
default = ["sessiond", "logind", "consolekit"]
sessiond = ["dep:hyprwire", "dep:hyprwire-protocols-sessiond"]
consolekit = ["dep:zbus"]
logind = ["dep:libsystemd-sys"]

[lints]
workspace = true
