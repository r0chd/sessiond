when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

environment:
  PKG_CONFIG_PATH: /lib/pkgconfig:/share/pkgconfig
  LIBRARY_PATH: /lib
  RUSTFLAGS: "-L native=/lib"
  RUSTDOCFLAGS: "-L native=/lib"
  LD_LIBRARY_PATH: /lib

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - pkg-config
    - linux-pam.out
    - udev.out
    - udev.dev
    - acl.out
    - acl.dev

steps:
  - name: cargo check
    command: |
      set -eu
      rustup toolchain install stable
      rustup default stable
      pkg-config --libs --cflags pam libudev libsystemd libacl

      # libsession is not part of the daemon release checks yet.
      cargo check --locked --workspace --exclude libsession --exclude libsession-sys --exclude libsession-rs --all-targets --no-default-features
      cargo check --locked --workspace --exclude libsession --exclude libsession-sys --exclude libsession-rs --all-targets --all-features
