[workspace]
members = ["ctl", "daemon", "pam"]
resolver = "3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[workspace.package]
keywords = []
categories = []
edition = "2024"
license = "GPLv3"
repository = "https://github.com/mox-desktop/moxsession"
version = "0.1.0"
description = ""
readme = "README.md"
