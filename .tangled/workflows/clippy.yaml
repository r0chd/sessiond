when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

environment:
  PKG_CONFIG_PATH: /lib/pkgconfig:/share/pkgconfig
  LIBRARY_PATH: /lib
  RUSTFLAGS: "-L native=/lib"
  RUSTDOCFLAGS: "-L native=/lib"
  LD_LIBRARY_PATH: /lib

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - pkg-config
    - linux-pam.out
    - udev.out
    - udev.dev
    - acl.out
    - acl.dev

steps:
  - name: cargo clippy
    command: |
      set -eu
      rustup toolchain install stable
      rustup default stable
      rustup component add clippy
      pkg-config --libs --cflags pam libudev libsystemd libacl

      cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
