when:
  - event: ["push", "manual"]
    branch: ["*"]
  - event: ["pull_request"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - rustup
    - gcc
    - linux-pam
    - pkg-config
    - nix
    - udev
    - acl

steps:
  - name: cargo test
    command: |
      rustup toolchain install stable
      rustup default stable
      cargo build --package sessiond
      cargo test --package sessiond
      cargo test --manifest-path sessiond-backlight/Cargo.toml
      cargo test --manifest-path sessiond-hooks/Cargo.toml
      cargo test --manifest-path sessiond-uaccess/Cargo.toml

  - name: finix vm tests
    command: |
      nix --extra-experimental-features 'nix-command flakes' --option system-features 'benchmark big-parallel nixos-test uid-range kvm' build -L .#checks.x86_64-linux.finix-basic
      nix --extra-experimental-features 'nix-command flakes' --option system-features 'benchmark big-parallel nixos-test uid-range kvm' build -L .#checks.x86_64-linux.finix-vt-switch
      nix --extra-experimental-features 'nix-command flakes' --option system-features 'benchmark big-parallel nixos-test uid-range kvm' build -L .#checks.x86_64-linux.finix-termination
      nix --extra-experimental-features 'nix-command flakes' --option system-features 'benchmark big-parallel nixos-test uid-range kvm' build -L .#checks.x86_64-linux.finix-linger
      nix --extra-experimental-features 'nix-command flakes' --option system-features 'benchmark big-parallel nixos-test uid-range kvm' build -L .#checks.x86_64-linux.finix-state-recovery

  - name: nixos vm tests
    command: |
      nix --extra-experimental-features 'nix-command flakes' --option system-features 'benchmark big-parallel nixos-test uid-range kvm' build -L .#checks.x86_64-linux.nixos-basic
