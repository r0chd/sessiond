when:
  - event: ["push", "manual"]
    branch: ["master"]

engine: nixery

dependencies:
  nixpkgs:
    - cargo
    - cargo-llvm-cov
    - awscli2
    - gcc
    - llvm
    - linux-pam
    - pkg-config
    - jq
    - python3
    - which

steps:
  - name: coverage
    command: |
      export LLVM_COV=$(which llvm-cov)
      export LLVM_PROFDATA=$(which llvm-profdata)
      cargo build --package daemon --features consolekit
      cargo llvm-cov --package daemon --features consolekit --json --summary-only --output-path coverage.json
      pct=$(jq '.data[0].totals.lines.percent' coverage.json)
      pct_str=$(printf "%.1f%%" "$pct")
      python3 - "$pct_str" <<'PYEOF' > badge.svg
      import sys
      label, value = "coverage", sys.argv[1]
      cw = dict(f=5.6, i=2.8, l=2.8, t=4.4, r=3.9, j=2.8)
      def w(s): return int(sum(cw.get(c, 6.2) for c in s) + 10.5)
      lw, rw = w(label), w(value)
      tw, lx, rx = lw + rw, lw // 2, lw + rw // 2
      print(
          f'<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"'
          f' width="{tw}" height="20" role="img" aria-label="{label}: {value}">'
          f'<title>{label}: {value}</title>'
          f'<linearGradient id="s" x2="0" y2="100%">'
          f'<stop offset="0" stop-color="#bbb" stop-opacity=".1"/>'
          f'<stop offset="1" stop-opacity=".1"/></linearGradient>'
          f'<clipPath id="r"><rect width="{tw}" height="20" rx="3" fill="#fff"/></clipPath>'
          f'<g clip-path="url(#r)">'
          f'<rect width="{lw}" height="20" fill="#555"/>'
          f'<rect x="{lw}" width="{rw}" height="20" fill="#4c1"/>'
          f'<rect width="{tw}" height="20" fill="url(#s)"/></g>'
          f'<g fill="#fff" text-anchor="middle"'
          f' font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="110">'
          f'<text x="{lx*10}" y="150" fill="#010101" fill-opacity=".3"'
          f' transform="scale(.1)" textLength="{(lw-10)*10}" lengthAdjust="spacing">{label}</text>'
          f'<text x="{lx*10}" y="140" transform="scale(.1)"'
          f' textLength="{(lw-10)*10}" lengthAdjust="spacing">{label}</text>'
          f'<text x="{rx*10}" y="150" fill="#010101" fill-opacity=".3"'
          f' transform="scale(.1)" textLength="{(rw-10)*10}" lengthAdjust="spacing">{value}</text>'
          f'<text x="{rx*10}" y="140" transform="scale(.1)"'
          f' textLength="{(rw-10)*10}" lengthAdjust="spacing">{value}</text>'
          f'</g></svg>'
      )
      PYEOF

  - name: upload badge
    command: |
      AWS_ACCESS_KEY_ID="$ACCESS_KEY_ID" \
      AWS_SECRET_ACCESS_KEY="$SECRETS_ACCESS_KEY" \
      AWS_DEFAULT_REGION=garage \
      aws s3 cp badge.svg s3://coverage-badge/coverage.svg \
        --endpoint-url https://s3.garage.r0chd.pl \
        --content-type image/svg+xml \
        --cache-control "no-cache, no-store"
